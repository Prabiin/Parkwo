services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: parkingapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkingapp
      POSTGRES_USER: parkingapp_user
      POSTGRES_PASSWORD: parkingapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkingapp_user -d parkingapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: parkingapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: parkingapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: parkingapp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: parkingapp-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  api:
    build: .
    container_name: parkingapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=parkingapp;Username=parkingapp_user;Password=parkingapp_password
      - Jwt__Secret=ParkingApp-Test-Server-Secret-Key-At-Least-32-Chars-Long
      - Jwt__Issuer=ParkingApp
      - Jwt__Audience=ParkingApp.Mobile
      - Jwt__AccessTokenExpirationMinutes=30
      - Jwt__RefreshTokenExpirationDays=30
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=admin
      - Minio__SecretKey=admin12345
      - Minio__Bucket=parkingapp
      - Minio__UseSsl=false
      - Minio__PublicBaseUrl=http://localhost:9000
      - Upload__MaxImageSizeInMB=5
      - Upload__AllowedImageTypes__0=jpg
      - Upload__AllowedImageTypes__1=jpeg
      - Upload__AllowedImageTypes__2=png
      - ParkingStandards__TwoWheelerAreaSqM=2
      - ParkingStandards__FourWheelerAreaSqM=12.5
      - Elastic__Url=http://elasticsearch:9200
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  elastic_data:
