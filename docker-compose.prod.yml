# Shared integration-server overlay.
# Usage (on the server): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires: .env (copy from .env.example), DNS A records for the three domains, ports 80/443 open.
# NOTE: changing MINIO/POSTGRES credentials only takes effect on a FRESH volume
# (MinIO/Postgres persist their initial creds). For a fresh server this is automatic.
services:
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  minio:
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}

  api:
    environment:
      # Development keeps /scalar + DevCode OTP visible for the mobile team on this sandbox.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=parkingapp;Username=parkingapp_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - Minio__SecretKey=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - Minio__PublicBaseUrl=https://${MINIO_DOMAIN:?MINIO_DOMAIN is required}

  caddy:
    image: caddy:2-alpine
    container_name: parkingapp-caddy
    restart: unless-stopped
    depends_on:
      - api
      - minio
    environment:
      - API_DOMAIN=${API_DOMAIN:?API_DOMAIN is required}
      - MINIO_DOMAIN=${MINIO_DOMAIN:?MINIO_DOMAIN is required}
      - MINIO_CONSOLE_DOMAIN=${MINIO_CONSOLE_DOMAIN:?MINIO_CONSOLE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
