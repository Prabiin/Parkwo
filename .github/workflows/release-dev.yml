# Builds the API Docker image and pushes it to GHCR whenever release/dev moves
# (i.e. after a feature/* PR is merged). The hosted dev env pulls :dev.
name: release-dev

on:
  push:
    branches: [release/dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prabiin/parkwo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test ParkingApp.slnx --nologo -v q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/prabiin/parkwo
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
